<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동작 궤적·속도 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* 방향: 측정 장비 같은 절제된 화면. 무채색 바탕, 포인트 색 하나(코발트), 숫자는 좁은 서체로 크게. 상자 테두리 대신 여백과 가는 선으로 구분 */
:root{
  --bg:#f3f4f6;--surface:#ffffff;--sunken:#eceef1;--ink:#0f1215;--muted:#69707a;--line:#e2e5e9;
  --accent:#2448ff;--accent-ink:#ffffff;--accent-soft:rgba(36,72,255,.09);
  --up:#0f9a52;--down:#d9691a;--good:#0f9a52;--warn:#c27a00;--bad:#d23c3c;
  --good-soft:rgba(15,154,82,.11);--warn-soft:rgba(217,128,26,.13);--bad-soft:rgba(210,60,60,.1);
  --font-display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Barlow Semi Condensed","Noto Sans KR",system-ui,sans-serif;
  --r:14px;--shadow:0 0 0 1px var(--line),0 1px 2px rgba(15,18,21,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0b0d10;--surface:#14171b;--sunken:#1d2127;--ink:#eceff3;--muted:#8a929c;--line:#262b32;
    --accent:#7d95ff;--accent-ink:#0b0d10;--accent-soft:rgba(125,149,255,.13);
    --up:#3fcf86;--down:#f39a4a;--good:#3fcf86;--warn:#f0b44c;--bad:#ff7a7a;
    --good-soft:rgba(63,207,134,.13);--warn-soft:rgba(240,180,76,.13);--bad-soft:rgba(255,122,122,.12);--shadow:0 0 0 1px var(--line)}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0b0d10;--surface:#14171b;--sunken:#1d2127;--ink:#eceff3;--muted:#8a929c;--line:#262b32;
  --accent:#7d95ff;--accent-ink:#0b0d10;--accent-soft:rgba(125,149,255,.13);
  --up:#3fcf86;--down:#f39a4a;--good:#3fcf86;--warn:#f0b44c;--bad:#ff7a7a;
  --good-soft:rgba(63,207,134,.13);--warn-soft:rgba(240,180,76,.13);--bad-soft:rgba(255,122,122,.12);--shadow:0 0 0 1px var(--line)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:18px;font-weight:700;letter-spacing:-.025em}
h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
h3{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.01em;margin-top:6px}
p{margin:0} a{color:var(--accent);text-underline-offset:3px}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;padding:22px 0 14px}
.editbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:6px 0 14px}.editbox h3{margin-top:0}
.apps{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 8px;font-size:12.5px}.apps a{color:var(--muted);text-decoration:none;padding:2px 0}.apps a:hover{color:var(--accent)}
header.top .brand{display:block;font-family:var(--font-num);font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--muted);margin-bottom:2px}
header.top .where{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:7px;padding-bottom:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.cloud{background:var(--good)} .dot.local{background:var(--warn)}
nav.tabs{display:flex;gap:26px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding:0}
nav.tabs a{padding:12px 0 11px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
main{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px;line-height:1.6} .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:0}
.btn{border:0;background:var(--sunken);color:var(--ink);border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:42px;transition:background .15s,color .15s}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.primary:hover{background:var(--ink);opacity:.88}
.btn.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input[type=date],input[type=text],input[type=number],select,textarea{border:1px solid transparent;background:var(--sunken);border-radius:9px;padding:9px 12px;min-height:42px;width:100%;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--ink)}
.banner{border-left:2px solid var(--accent);padding:1px 0 1px 12px;font-size:13.5px;line-height:1.6}
.banner.warn{border-left-color:var(--warn)} .banner.bad{border-left-color:var(--bad)}
.pill{display:inline-flex;align-items:center;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:0;vertical-align:1px}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.w{background:var(--warn-soft);color:var(--warn)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--sunken);color:var(--muted)}
.stagebox{display:flex;justify-content:center;background:#0b0d10;border-radius:12px;padding:0;overflow:hidden}
#loupe{position:absolute;width:128px;height:128px;border-radius:50%;border:2px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.45);display:none;pointer-events:none;background:#000}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--sunken);color:var(--ink);border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;min-height:32px}
.chip.done{color:var(--good)} .chip.done::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.chip.cur{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.chip .mk{font-size:11px;color:var(--muted)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
table.mt{width:100%;border-collapse:collapse}
table.mt td,table.mt th{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle;text-align:left}
table.mt th{font-size:11.5px;color:var(--muted);font-weight:500;border-top:0;padding-top:0}
table.mt td.v,table.mt th.v{text-align:right;white-space:nowrap}
table.mt td.v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:15.5px;letter-spacing:0}
table.mt td.s{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
svg.chart{width:100%;max-width:700px;height:auto;display:block}
svg text{font-family:var(--font-body)}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
details{border-top:1px solid var(--line);padding:12px 0 0}
details summary{cursor:pointer;font-weight:600;list-style-position:outside}
details>*:not(summary){margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.2)}

.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{position:relative;display:inline-block;line-height:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage img,.stage video{-webkit-user-drag:none;-webkit-touch-callout:none}
.stage.pick{touch-action:none;cursor:crosshair}
.stage canvas#cv{display:block;max-width:100%;max-height:68vh}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step .n{font-family:var(--font-num);font-weight:600;font-size:17px;line-height:1.9;color:var(--muted)}
.step.done .n{color:var(--accent)}
.step .b{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--ink);opacity:.85;min-width:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border-top:1px solid var(--line);padding:12px 0 10px}
.tile .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.01em;margin-top:2px}
.tile .v small{font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.tiles .tile:first-child .v{color:var(--accent)}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

/* ===== 앱형 레이아웃: 떠 있는 카드 대신 전체 폭 구역, 사진·영상은 어두운 편집 영역, 휴대폰은 아래 탭 ===== */
:root{--band:#e9ecf0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--band:#000}}
:root[data-theme="dark"]{--band:#000}
body{background:var(--band);font-size:15.5px}
.muted{color:var(--muted)}
.card{box-shadow:none;border-radius:20px}
.card.editor{--surface:#0c0e11;--sunken:#1c2027;--ink:#eef1f4;--muted:#9aa3ad;--line:#2a3038;--accent:#8ea3ff;--accent-soft:rgba(142,163,255,.16);
  --good:#46d68e;--good-soft:rgba(70,214,142,.15);--warn:#f2b552;--warn-soft:rgba(242,181,82,.15);--bad:#ff7d7d;--bad-soft:rgba(255,125,125,.14);color-scheme:dark;color:var(--ink)}
.card.editor .stagebox{border-radius:14px;background:#000}
header.top{background:transparent}
header.top .brand{font-size:11px;letter-spacing:.14em}
nav.tabs{background:var(--band)}
nav.tabs a{display:flex;align-items:center;gap:7px}
nav.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* 판정 표시: 색 상자 대신 점 + 글자 */
.pill{background:none!important;padding:0;border-radius:0;font-size:12.5px;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.n{color:var(--muted)}
table.mt td,table.mt th{padding:13px 4px}
table.mt td b{font-weight:600}
h2{font-size:18px}
h3{font-size:13px;margin-top:10px}
@media (max-width:720px){
  .wrap{padding:0 0 calc(84px + env(safe-area-inset-bottom))}
  header.top{background:var(--surface);padding:18px 20px 14px;margin:0;align-items:flex-start;flex-direction:column;gap:2px}
  header.top h1{font-size:22px}
  header.top .where{margin-left:0;padding:4px 0 0}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;background:var(--surface);border-bottom:0;border-top:1px solid var(--line);gap:0;padding:4px 4px env(safe-area-inset-bottom);justify-content:space-around}
  nav.tabs a{flex:1;flex-direction:column;gap:3px;padding:8px 0 7px;font-size:11px;font-weight:500;border-bottom:0;margin:0;justify-content:center}
  nav.tabs a[aria-current="page"]{border-bottom:0;color:var(--ink);font-weight:700}
  nav.tabs svg{width:24px;height:24px}
  main{margin-top:10px;gap:10px}
  .measure,.cols,.side{gap:10px!important}
  .card{border-radius:0;padding:22px 20px}
  .card.editor{padding:16px 0 20px}
  .card.editor>*:not(.stagebox){margin-left:20px;margin-right:20px}
  .card.editor .stagebox{border-radius:0}
  .btn.primary{flex:1 1 auto;min-height:48px;font-size:15px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* 휴대폰 호환: 실제 파일 선택 칸을 버튼 위에 투명하게 덮어 손가락이 바로 누르게 함 */
label.pick{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
label.pick input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:1}
label.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* 기기 연결 시트 */
#syncSheet{position:fixed;inset:0;z-index:40;background:rgba(8,10,12,.45);display:flex;align-items:flex-end;justify-content:center}
#syncSheet[hidden]{display:none}
#syncSheet .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
@media (min-width:721px){#syncSheet{align-items:center}#syncSheet .sheet{border-radius:18px}}
header.top .where .btn{margin-left:6px;min-height:28px;padding:3px 10px;font-size:12px}

.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;min-height:34px;font-weight:500;font-size:13.5px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 측정 추가·고치기: 접는 목록 */
.tools{display:flex;flex-direction:column}
details.tool{border-top:1px solid var(--line);padding:0}
details.tool:last-child{border-bottom:1px solid var(--line)}
details.tool>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px 2px;cursor:pointer;min-height:52px}
details.tool>summary::-webkit-details-marker{display:none}
details.tool>summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s}
details.tool[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.tool .tt{font-weight:700;font-size:15px}
details.tool .ts{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
details.tool .tb{display:flex;flex-direction:column;gap:12px;padding:0 2px 18px}
details.tool .tb>*{margin-top:0}
.gh{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
dl.gsteps{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dl.gsteps dt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
dl.gsteps dd{margin:0}
details.gd .tb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
table.gsum td,table.gsum th{font-size:13px;vertical-align:top}
table.gsum td:first-child{white-space:nowrap}
#saveCard .field{margin-top:2px}
.cmprecs{flex-direction:column;align-items:stretch}.cmprecs .field{flex:none;width:100%}
</style>
</head>
<body>
<video id="vid" playsinline muted preload="auto"></video>
<div class="wrap">
  <header class="top">
    <div><nav class="apps" aria-label="다른 화면"><a href="../" data-path="">← 처음 화면</a><a href="../streamline/" data-path="streamline/">스트림라인 자세 분석 →</a></nav><span class="brand">SWIM ANALYSIS LAB</span><h1>동작 궤적·속도 분석</h1></div>
    <div class="where" id="where"><span class="dot"></span><span>저장 위치 확인 중</span></div>
  </header>
<script>/* 처음 화면·다른 앱 링크: GitHub Pages나 파일로 열면 상대 경로, claude.ai 아티팩트 등 다른 곳에서는 사이트 주소로 */
(function(){const h=location.hostname;if(location.protocol==='file:'||/github\.io$/.test(h))return;const base='https://swim-analysis-lab.github.io/swim-analysis-tools/';document.querySelectorAll('.apps a[data-path]').forEach(a=>{a.href=base+a.dataset.path})})();</script>

  <nav class="tabs" aria-label="화면">
    <a href="#analyze" data-v="analyze"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor" stroke="none"/></svg><span>분석</span></a>
    <a href="#records" data-v="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg><span>기록·비교</span></a>
    <a href="#guide" data-v="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg><span>방법</span></a>
  </nav>
  <main id="main"></main>
</div>
<div id="syncSheet" hidden></div>
<div id="toast" class="toast" style="display:none" role="status"></div>

<script id="core">
/* ===== 계산부: 화면과 무관한 순수 함수 ===== */
const G=9.81;
function toGray(d,w,h){const g=new Float32Array(w*h);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=.299*d[j]+.587*d[j+1]+.114*d[j+2];return g}
function cutPatch(g,w,h,cx,cy,half){const side=2*half+1,o=new Float32Array(side*side);cx=Math.round(cx);cy=Math.round(cy);
  for(let dy=0;dy<side;dy++){const y=Math.min(h-1,Math.max(0,cy-half+dy));for(let dx=0;dx<side;dx++){const x=Math.min(w-1,Math.max(0,cx-half+dx));o[dy*side+dx]=g[y*w+x]}}return o}
/* 정규화 상관(ZNCC): 밝기 변화에 덜 민감한 닮음 정도, -1~1 */
function znccAt(g,w,h,tm,half,px,py,st){if(px-half<0||py-half<0||px+half>=w||py+half>=h)return -2;const side=2*half+1;let Sa=0,Sb=0,Saa=0,Sbb=0,Sab=0,n=0;
  for(let dy=0;dy<side;dy+=st){const ro=(py-half+dy)*w+(px-half),to=dy*side;for(let dx=0;dx<side;dx+=st){const a=tm[to+dx],b=g[ro+dx];Sa+=a;Sb+=b;Saa+=a*a;Sbb+=b*b;Sab+=a*b;n++}}

/* ----- 저장소: 계정 저장 우선, 안 되면 이 브라우저. 영상은 저장하지 않고 궤적 숫자만 저장 ----- */
const Store={mode:'checking',col:null,migrated:false,
  async init(){S.recs=LS.get('mv_recs',[]);let db=null,user=null,uid=null;
    for(let i=0;i<10&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
    try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}}catch(e){}
    try{uid=user?await user.id():null}catch(e){}
    if(!db||!uid){this.mode='local';refresh();return}
    try{this.col=db.collection('data/users/'+uid)}catch(e){this.mode='local';refresh();return}
    const timer=setTimeout(()=>{if(this.mode==='checking'){this.mode='slow';refresh()}},10000);
    this.col.onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);const recs=[];
      snap.docs.forEach(d=>{const x=d.data();if(x&&d.id.indexOf('mv_')===0)recs.push(JSON.parse(JSON.stringify(x)))});
      this.mode='cloud';S.recs=recs;if(!this.migrated&&!snap.metadata.fromCache){this.migrated=true;this.migrate(recs)}refresh();
    },()=>{clearTimeout(timer);this.mode='local';S.recs=LS.get('mv_recs',[]);refresh()})},
  async migrate(cloud){const local=LS.get('mv_recs',[]);if(!local.length)return;const left=[];for(const r of local){if(cloud.find(c=>c.id===r.id))continue;try{await this.col.doc(r.id).set(r)}catch(e){left.push(r)}}LS.set('mv_recs',left)},
  async save(rec){if(this.mode==='cloud'){try{await this.col.doc(rec.id).set(rec);S.recs=S.recs.filter(x=>x.id!==rec.id).concat([rec]);return 'cloud'}catch(e){}}
    const a=LS.get('mv_recs',[]).filter(r=>r.id!==rec.id);a.push(rec);if(!LS.set('mv_recs',a))return 'fail';if(this.mode!=='cloud')S.recs=a;else S.recs=S.recs.filter(x=>x.id!==rec.id).concat([rec]);return 'local'},
  async remove(id){const a=LS.get('mv_recs',[]),inLocal=a.find(r=>r.id===id);if(inLocal)LS.set('mv_recs',a.filter(r=>r.id!==id));
    if(this.mode==='cloud'&&!inLocal){try{await this.col.doc(id).delete()}catch(e){toast('삭제하지 못했습니다. 연결 상태를 확인해 주세요.');return}}
    S.recs=S.recs.filter(r=>r.id!==id)}
};

function demoTrack(){const fs=60,n=Math.round(2.4*fs),t=[],x=[],y=[],c=[],sm=u=>u<=0?0:u>=1?1:u*u*u*(u*(6*u-15)+10),px=300;
  for(let i=0;i<n;i++){const s=i/fs;let Y=1.05*sm((s-.1)/1.0)-.2*sm((s-1.0)/.35)+.8*sm((s-1.5)/.8);let X=-.06*sm((s-.15)/.45)+.11*sm((s-.5)/.5)-.03*sm((s-1.45)/.8);
    t.push(s);x.push(190+X*px);y.push(650-Y*px);c.push(1)}
  return {t,x,y,c}}
const smo=u=>u<=0?0:u>=1?1:u*u*u*(u*(6*u-15)+10);

  for(let i=0;i<=5.8*fs;i++){const t=i/fs;let Y=0;R.forEach(([a,d,rom])=>{if(t>=a&&t<a+d)Y+=rom*smo((t-a)/d);else if(t>=a+d&&t<a+d+.25)Y+=rom;else if(t>=a+d+.25)Y+=rom*(1-smo((t-a-d-.25)/.6))});
    tr.t.push(t);tr.x.push(200+5*Math.sin(t*1.7));tr.y.push(600-Y*px);tr.c.push(1)}
  return {tr,cal:[[330,640],[330,640-.45*px]],cm:45,bar:[200,600-.52*px],cur:1.05}}

  const herm=(t,t0,t1,y0,y1,v0,v1)=>{const d=t1-t0,u=(t-t0)/d;return (2*u**3-3*u**2+1)*y0+(u**3-2*u**2+u)*d*v0+(-2*u**3+3*u**2)*y1+(u**3-u**2)*d*v1};
  const Y=t=>t<.4?0:t<.85?-.30*smo((t-.4)/.45):t<tTo?herm(t,.85,tTo,-.30,yTo,0,vto):t<tLd?yTo+vto*(t-tTo)-4.905*(t-tTo)**2:t<tLd+.3?herm(t,tLd,tLd+.3,yTo,-.15,-vto,0):-.15+.15*smo((t-tLd-.3)/.5);

function demoStart(){const px=48,wx=26,wy=430,fs=120,tau=(0.5+Math.sqrt(0.25+4*4.905*0.55))/(2*4.905),eT=1.2+tau,eD=.9+4.5*tau,tr={t:[],x:[],y:[],c:[],P:{hip:{x:[],y:[],c:[]},knee:{x:[],y:[],c:[]},ankle:{x:[],y:[],c:[]}}};
  /* 다리: 준비 자세에서 허벅지 -70°·정강이 -125°(무릎 약 125°), 밀면서 뒤로 돌아 비행 중에는 몸통 선(158°)에 맞춰 펴짐, 물속에서는 거의 수평 */

  const st=Math.max(1,Math.floor(r.X.length/200));for(let i=st;i<r.X.length;i+=st)s+='<line x1="'+PX(r.X[i-st]).toFixed(1)+'" y1="'+PY(r.Y[i-st]).toFixed(1)+'" x2="'+PX(r.X[i]).toFixed(1)+'" y2="'+PY(r.Y[i]).toFixed(1)+'" stroke="'+(r.Y[i]>=r.Y[i-st]?'var(--up)':'var(--down)')+'" stroke-width="3" stroke-linecap="round"/>';
  const n=r.X.length-1;s+='<circle cx="'+PX(r.X[0])+'" cy="'+PY(r.Y[0])+'" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><rect x="'+(PX(r.X[n])-5)+'" y="'+(PY(r.Y[n])-5)+'" width="10" height="10" fill="var(--ink)"/>';
  const bar=.1*sc;s+='<line x1="'+(W-pad-bar)+'" x2="'+(W-pad)+'" y1="'+(H-10)+'" y2="'+(H-10)+'" stroke="var(--muted)" stroke-width="2"/><text x="'+(W-pad-bar/2)+'" y="'+(H-15)+'" text-anchor="middle" font-size="11" fill="var(--muted)">10 cm</text>';
  return '<svg class="chart" style="max-width:300px" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="궤적. 가로세로 같은 축척">'+s+'</svg>'}

const UH={u:[],r:[]};
const cp=a=>a?a.slice():a;
function snapV(){const ex={};Object.keys(V.extra).forEach(k=>ex[k]=cp(V.extra[k]));return {bgsub:V.bgsub,tmode:V.tmode,sport:V.sport,preset:V.preset,rate:V.rate,half:V.half,fixK:V.fixK,target:cp(V.target),extra:ex,cal:{a:cp(V.cal.a),b:cp(V.cal.b),cm:V.cal.cm},bar:cp(V.bar),man:Object.assign({},V.man),track:V.track,t0:V.t0,t1:V.t1,tIdx:V.tIdx,fixes:V.fixes.map(f=>Object.assign({},f))}}

function resetUndo(){UH.u=[];UH.r=[]}
function undoV(redo){if(V.busy)return;const A=redo?UH.r:UH.u,B=redo?UH.u:UH.r;if(!A.length)return;stopPlay();const e=A.pop();B.push({s:snapV(),label:e.label});
  const s=e.s,keepFix=V.mode==='fix'&&!!s.track;Object.assign(V,{bgsub:!!s.bgsub,tmode:s.tmode||V.tmode,sport:s.sport,preset:s.preset,rate:s.rate,half:s.half,fixK:s.fixK,target:s.target,extra:s.extra,cal:s.cal,bar:s.bar,man:s.man,track:s.track,t0:s.t0,t1:s.t1,tIdx:s.tIdx,fixes:s.fixes||[],mode:keepFix?'fix':null,res:null,rep:null}); /* 고치는 중에 되돌리면 고치기는 켜 둔 채 */

      if(rows&&rows.length&&rows[0].data){try{remote=JSON.parse(await SyncCore.dec(this.key,rows[0].data))}catch(e){throw new Error('dec')}}
      const L=SyncLocal.get(),M=remote?SyncCore.merge(L,remote):SyncCore.merge(L,{});SyncLocal.set(M);
      if(!remote||JSON.stringify(SyncCore.merge(remote,{}))!==JSON.stringify(M))await this.rpc('sync_put',{p_id:this.id,p_app:SYNC.app,p_data:await SyncCore.enc(this.key,JSON.stringify(M))});
      this.last=Date.now();refresh()}
    catch(e){this.err=e.message}
    this.busy=false;syncUI();if(this.again){this.again=false;this.run()}},
  async create(){if(!this.ready())throw new Error('setup');for(let k=0;k<5;k++){const c=SyncCore.gen(),id=await SyncCore.hex('swim-analysis-lab/id/'+c);
      if(await this.rpc('sync_claim',{p_id:id})===true){await this.use(c);LS.set('sal_code',c);await this.run();return c}}throw new Error('claim')},
  async join(x){const c=SyncCore.norm(x);if(!c)return 'bad';const id=await SyncCore.hex('swim-analysis-lab/id/'+c);
    if(await this.rpc('sync_exists',{p_id:id})!==true)return 'none';await this.use(c);LS.set('sal_code',c);await this.run();return 'ok'},
  leave(){LS.del('sal_code');this.code=this.id=this.key=null;this.last=this.err=null;syncUI()}};
/* 저장·삭제할 때 고친 시각과 지운 기록을 남기고 곧바로 맞춤 */
(function(){const sv=Store.save.bind(Store),rm=Store.remove.bind(Store);
  Store.save=async function(rec,...a){rec.u=Date.now();const r=await sv(rec,...a);Sync.soon();return r};
  Store.remove=async function(id){const d=LS.get(SyncLocal.dk,{});d[id]=Date.now();LS.set(SyncLocal.dk,d);const r=await rm(id);Sync.soon();return r};
  if(Store.saveTests){const st=Store.saveTests.bind(Store);Store.saveTests=async function(t){LS.set('sl_testsU',Date.now());const r=await st(t);Sync.soon();return r}}})();
const syncErr=e=>e==='net'||/^http5/.test(e||'')?'서버에 연결하지 못했습니다. 인터넷을 확인해 주세요. 서버가 7일 동안 쓰이지 않아 잠시 멈춘 것일 수도 있습니다. 이 기기의 기록은 그대로 있습니다.':e==='dec'?'서버 기록을 풀지 못했습니다. 코드를 다시 확인해 주세요.':e==='setup'?'아직 서버 설정이 끝나지 않았습니다.':'동기화하지 못했습니다 ('+e+'). 잠시 뒤 다시 시도해 주세요.';
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const _where0=whereUI;
whereUI=function(){_where0();const w=document.getElementById('where');if(!w)return;
  if(Sync.code&&Sync.on()){w.innerHTML='<span class="dot '+(Sync.err?'local':'cloud')+'"></span><span>'+(Sync.busy?'맞추는 중':Sync.err?'동기화 안 됨':'코드 연결'+(Sync.last?' · '+hm(Sync.last):''))+'</span>'}
  if(Sync.on()){const b=document.createElement('button');b.type='button';b.className='btn sm';b.id='syncOpen';b.textContent=Sync.code?'코드':'기기 연결';w.appendChild(b)}};
function syncUI(){whereUI();const el=document.getElementById('syncSheet');if(!el)return;if(!Sync.open){el.hidden=true;return}el.hidden=false;
  const photoNote=SYNC.app==='streamline'?'<li>측면 사진은 올라가지 않고 이 기기에만 남습니다. 다른 기기에서는 수치·관절선·그래프만 보입니다.</li>':'';
  let h='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="syncTitle"><div class="row"><h2 id="syncTitle">기기 연결 코드</h2><button class="btn sm" type="button" id="syncClose" style="margin-left:auto">닫기</button></div>';
  if(!Sync.ready())h+='<p class="muted">서버 설정이 아직 끝나지 않았습니다.</p>';
  else if(!Sync.code){h+='<p class="small muted">로그인 없이 코드 하나로 폰과 노트북의 기록을 맞춥니다. 이 기기에서 처음이면 새 코드를 만들고, 다른 기기에서 만든 코드가 있으면 입력하세요.</p>'+
    '<div class="row"><button class="btn primary" type="button" id="syncNew">새 코드 만들기</button></div>'+
    '<div class="field"><label for="syncIn">다른 기기에서 만든 코드</label><div class="row" style="flex-wrap:nowrap"><input id="syncIn" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" class="num" style="letter-spacing:.06em"><button class="btn" type="button" id="syncJoin">연결</button></div></div>'}
  else{h+='<div><div class="small muted">이 기기의 코드</div><div class="num" id="syncCode" style="font-size:clamp(20px,6.4vw,28px);font-weight:600;letter-spacing:.03em;white-space:nowrap;user-select:all;-webkit-user-select:all">'+esc(Sync.code)+'</div></div>'+
    '<div class="row"><button class="btn primary" type="button" id="syncCopy">코드 복사</button><button class="btn" type="button" id="syncNow"'+(Sync.busy?' disabled':'')+'>지금 맞추기</button></div>'+
    '<p class="small '+(Sync.err?'':'muted')+'">'+(Sync.busy?'맞추는 중입니다.':Sync.err?syncErr(Sync.err):Sync.last?'마지막으로 맞춘 시각 '+hm(Sync.last):'')+'</p>'+
    '<div class="row"><button class="btn sm danger" type="button" id="syncLeave">이 기기에서 연결 끊기</button></div>'}
  if(Sync.msg)h+='<p class="small" role="status">'+esc(Sync.msg)+'</p>';
  h+='<ul class="small muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>코드를 잃어버리면 서버의 기록을 되살릴 수 없습니다. 메모장에 저장해 두세요.</li><li>코드를 아는 사람은 기록을 볼 수 있습니다. 다른 사람에게 알려주지 마세요.</li>'+photoNote+'<li>연결을 끊어도 이 기기의 기록은 지워지지 않습니다.</li></ul></div>';
  el.innerHTML=h}
document.addEventListener('click',async e=>{const t=e.target.closest('#syncOpen,#syncClose,#syncNew,#syncJoin,#syncCopy,#syncNow,#syncLeave,#syncSheet');if(!t)return;
  if(t.id==='syncSheet'){if(e.target===t){Sync.open=false;syncUI()}return}
  if(t.id==='syncOpen'){Sync.open=true;Sync.msg='';syncUI();return}
  if(t.id==='syncClose'){Sync.open=false;syncUI();return}
  Sync.msg='';
  if(t.id==='syncNew'){t.disabled=true;try{await Sync.create();Sync.msg='새 코드를 만들었습니다. 다른 기기에서 이 코드를 입력하세요.'}catch(x){Sync.msg=syncErr(x.message)}syncUI()}
  else if(t.id==='syncJoin'){const v=document.getElementById('syncIn').value;t.disabled=true;try{const r=await Sync.join(v);Sync.msg=r==='bad'?'코드 형식이 맞지 않습니다. 영문·숫자 16자리입니다.':r==='none'?'없는 코드입니다. 다시 확인해 주세요.':'연결했습니다. 두 기기의 기록을 합쳤습니다.'}catch(x){Sync.msg=syncErr(x.message)}syncUI()}
  else if(t.id==='syncCopy'){try{await navigator.clipboard.writeText(Sync.code);Sync.msg='복사했습니다.'}catch(x){Sync.msg='복사가 막혀 있습니다. 코드를 길게 눌러 복사해 주세요.'}syncUI()}
  else if(t.id==='syncNow'){await Sync.run()}
  else if(t.id==='syncLeave'){Sync.leave();Sync.msg='이 기기에서 연결을 끊었습니다.';syncUI()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Sync.open){Sync.open=false;syncUI()}});
Sync.boot();
</script>

<script>/* 사진·영상 위 길게 누르기 메뉴와 끌기 막기 */document.addEventListener('contextmenu',e=>{if(e.target.closest('.stage'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.closest('.stage'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('.stage'))e.preventDefault()});</script>
</body>
